@if (auth.isAuthenticated()) {

  <!-- Toolbar principal -->
  <mat-toolbar color="primary" style="position:sticky; top:0; z-index:100; box-shadow: 0 2px 6px rgba(0,0,0,0.2)">
    <div style="display:flex; align-items:center; width:100%; max-width:1200px; margin:0 auto; gap:8px">

      <!-- Logo -->
      <a routerLink="/products" class="toolbar-logo">
        <mat-icon>shopping_cart</mat-icon>
        <span>ShoppingCart</span>
      </a>

      <span class="toolbar-spacer"></span>

      <!-- Nav links -->
      <a mat-button routerLink="/products" routerLinkActive="active-nav"
         style="color:white">
        <mat-icon>inventory_2</mat-icon>
        Productos
      </a>

      <a mat-button routerLink="/orders" routerLinkActive="active-nav"
         style="color:white">
        <mat-icon>receipt_long</mat-icon>
        Mis Órdenes
      </a>

      @if (auth.role() === 'Admin') {
        <a mat-button routerLink="/admin/products" routerLinkActive="active-nav"
           style="color:white; background:rgba(255,255,255,0.12); border-radius:4px"
           matTooltip="Panel de administrador">
          <mat-icon>admin_panel_settings</mat-icon>
          Admin
        </a>
      }

      <!-- Carrito con badge -->
      <a mat-icon-button routerLink="/cart" matTooltip="Ver carrito" style="color:white">
        @if (cartStore.itemCount() > 0) {
          <mat-icon [matBadge]="cartStore.itemCount() > 99 ? '99+' : cartStore.itemCount()"
                    matBadgeColor="accent"
                    matBadgeSize="small">
            shopping_cart
          </mat-icon>
        } @else {
          <mat-icon>shopping_cart</mat-icon>
        }
      </a>

      <!-- Menú usuario -->
      <button mat-button [matMenuTriggerFor]="userMenu" style="color:white">
        <mat-icon>account_circle</mat-icon>
        <span style="margin-left:4px">{{ auth.username() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>badge</mat-icon>
          <span>{{ auth.role() }}</span>
        </button>
        <mat-divider />
        <button mat-menu-item (click)="auth.logout()">
          <mat-icon color="warn">logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>

    </div>
  </mat-toolbar>

  <!-- Contenido principal -->
  <div style="max-width:1200px; margin:24px auto; padding:0 16px">
    <router-outlet />
  </div>

} @else {
  <router-outlet />
}
